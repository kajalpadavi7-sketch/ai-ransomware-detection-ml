<!DOCTYPE html>

<html>

<head>

    <title>AI Ransomware Detection</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: #151f32;
            padding: 40px;
            border-radius: 15px;
        }

        h1 {
            color: #00c8ff;
        }

        input {
            margin: 30px;
            padding: 12px;
        }

        button {
            background: #00a8ff;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0086cc;
        }

        .error {
            color: #ff5555;
            margin-top: 20px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>AI-Based Ransomware Detection</h1>

    <p>
        Upload a Windows executable (.exe) file
        for analysis.
    </p>


    <form
        action="/detect"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="file"
            accept=".exe"
            required
        >

        <br>

        <button type="submit">
            Analyze File
        </button>

    </form>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

</div>

</body>

</html>
